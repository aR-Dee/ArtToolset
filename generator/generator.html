<script src="randomizer.js"></script>
<script>
  // Toggle all / none per group
  document.querySelectorAll('.toggle-all').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var boxes = document.querySelectorAll('input.' + btn.dataset.group);
      var allChecked = Array.from(boxes).every(function(b) { return b.checked; });
      boxes.forEach(function(b) { b.checked = !allChecked; });
    });
  });
</script>
